# Docker Compose moderno - No se requiere el campo 'version'
# Las credenciales se leen del fichero .env (ver .env.example).
name: ${COMPOSE_PROJECT_NAME}
services:
  # FastAPI and Python application services.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-management-api
    container_name: task-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL Database Service.
  db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Networks for inter-service communication.
networks:
  app-network:
    driver: bridge

# Volume for persisting data.
volumes:
  db_data:
    name: task-data-db
