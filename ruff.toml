# ============================================================
#  ruff.toml template — copied to the root of each repo.
#  It controls the VS Code settings because the profile contains
#  "ruff.configurationPreference": "filesystemFirst".
#  The same configuration is read by `ruff check .` in CI.
# ============================================================

line-length = 88
indent-width = 4

# Set it to the minimum version supported by the project: Ruff uses this
# to determine which UP rewrites are safe.
target-version = "py311"

src = ["src", "."]

extend-exclude = [
    ".venv",
    "build",
    "dist",
    "migrations",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PD",   # pandas-vet
    "NPY",  # numpy
    "S",    # flake8-bandit (seguridad)
    "PTH",  # flake8-use-pathlib
]

ignore = [
    "E203",  # whitespace antes de ':' — choca con el formateador
]

# Allows  `_`, `__`, `_unused` variables to be discarded without warning.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# S101 = use of assert: that's exactly what pytest does.
"tests/**/*.py" = ["S101", "S105", "S106", "PD901"]
"test_*.py" = ["S101"]

# S603/S607 = subprocess without an explicit `shell=False` and a binary without a path
# absolute. In deployment scripts that call `ansible-playbook`,
# SQL*Plus or RMAN is the standard practice, not an anomaly.
"scripts/**/*.py" = ["S603", "S607"]

# Los __init__.py reexportan a propósito.
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["mi_paquete"]  # <- switch to the package from the repo
combine-as-imports = true
force-sort-within-sections = true

[lint.pep8-naming]
# Decorators who receive CLS and are not required to report N805.
classmethod-decorators = ["classmethod"]

[lint.flake8-bugbear]
# Immutable types accepted as default values (FastAPI, typer...)
extend-immutable-calls = []

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
